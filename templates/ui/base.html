<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Co-op claims{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="brand">Co-op claims</div>
      <a href="/" class="{% if active == 'home' %}active{% endif %}">Home</a>
      <a href="/queue" class="{% if active == 'queue' %}active{% endif %}">Needs you {% if needs_you_count %}<span class="badge">{{ needs_you_count }}</span>{% endif %}</a>
      <a href="/#claims" class="{% if active == 'claims' %}active{% endif %}">Claims</a>
      <a href="/program" class="{% if active == 'program' %}active{% endif %}">Program rules</a>
      <a href="/funds" class="{% if active == 'funds' %}active{% endif %}">Funds</a>
      <a href="/audit" class="{% if active == 'audit' %}active{% endif %}">Audit trail</a>
      <div class="mode">Replay mode. Saved model responses, no network needed.</div>
    </nav>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
